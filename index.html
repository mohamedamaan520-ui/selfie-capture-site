<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Selfie Capture</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 20% 20%,#6d4aff 0,#171329 38%,#05050a 100%);color:#fff}
.card{width:min(92vw,520px);padding:34px;border:1px solid #ffffff2b;border-radius:30px;background:#ffffff12;backdrop-filter:blur(20px);box-shadow:0 30px 80px #0008;text-align:center}
h1{font-size:38px;margin:0 0 10px}p{color:#c9c5d9;line-height:1.5}.start{border:0;border-radius:999px;padding:17px 34px;font-size:18px;font-weight:800;color:white;background:linear-gradient(135deg,#8b5cf6,#06b6d4);cursor:pointer;box-shadow:0 12px 35px #0006}
video,canvas{width:100%;border-radius:22px;margin-top:20px;display:none}.status{margin-top:18px;color:#d9d4e8}
</style>
</head>
<body>
<main class="card">
<h1>Selfie Capture</h1>
<p>Press START to allow camera access. Your browser will ask for permission before the selfie camera opens.</p>
<button class="start" id="start">START</button>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div class="status" id="status"></div>
</main>
<script>
const start=document.getElementById('start'),video=document.getElementById('video'),canvas=document.getElementById('canvas'),status=document.getElementById('status');
start.onclick=async()=>{try{status.textContent='Requesting camera permission…';const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;video.style.display='block';status.textContent='Camera ready. Capturing…';await new Promise(r=>setTimeout(r,1000));canvas.width=video.videoWidth;canvas.height=video.videoHeight;canvas.getContext('2d').drawImage(video,0,0);canvas.style.display='block';stream.getTracks().forEach(t=>t.stop());status.textContent='Photo captured successfully.';}catch(e){status.textContent='Camera permission was denied or unavailable.';}};
</script>
</body>
</html>
